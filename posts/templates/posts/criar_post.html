{% extends 'posts/base.html' %}

{% block content %}

<h1>Novo Post</h1>

{% if erros %}
    <div class="alert alert-danger" role="alert">
        <ul class="mb-0">
            {% for erro in erros %}
                <li>{{ erro }}</li>
            {% endfor %}
        </ul>
    </div>
{% endif %}

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="mb-3">
        <label for="campo-titulo" class="form-label">Titulo</label>
        <input type="text" id="campo-titulo" name="titulo" class="form-control"
               value="{{ valores.titulo|default:'' }}" maxlength="100" required>
    </div>

    <div class="mb-3">
        <label for="campo-descricao" class="form-label">Descricao</label>
        <textarea id="campo-descricao" name="descricao" class="form-control"
                  required>{{ valores.descricao|default:'' }}</textarea>
    </div>

    <div class="mb-3">
        <label for="campo-categoria" class="form-label">Categoria</label>
        <select id="campo-categoria" name="categoria" class="form-select" required>
            <option value="">Selecione uma categoria</option>
            {% for valor, rotulo in categorias %}
                <option value="{{ valor }}"
                    {% if valores.categoria == valor %}selected{% endif %}>{{ rotulo }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label for="campo-telefone" class="form-label">Telefone para contato (opcional)</label>
        <input type="text" id="campo-telefone" name="telefone" class="form-control"
               value="{{ valores.telefone|default:'' }}" maxlength="20">
    </div>

    <div class="mb-3">
        <label for="campo-imagem" class="form-label">Imagem (opcional)</label>
        <input type="file" id="campo-imagem" name="imagem" class="form-control" accept="image/*">
    </div>

    <button type="submit" class="btn btn-success">Salvar</button>
    <a href="/" class="btn btn-secondary">Cancelar</a>
</form>

{% endblock %}
