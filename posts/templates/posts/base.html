{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartBairro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">

        <!-- LOGO / HOME -->
        <a class="navbar-brand fw-bold" href="/" style="font-size: 1.3rem; letter-spacing: 0.5px;">
             Smart<span style="color:#0d6efd;">Bairro</span>
        </a>

        <!-- BOTÕES DIREITA -->
        <div class="d-flex align-items-center">

    {% if user.is_authenticated %}

        <span class="me-3 text-white">
            👤 {{ user.username }}
        </span>

        <a href="/criar/" class="btn btn-primary btn-sm me-2">
            + Novo Post
        </a>

        <form action="/logout/" method="POST" style="display:inline;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-sm">
                Logout 👋
            </button>
        </form>

    {% else %}

        {% if request.path != '/login/' %}
            <a href="/login/" class="btn btn-primary btn-sm me-2">Login</a>
        {% endif %}

        {% if request.path != '/cadastro/' %}
            <a href="/cadastro/" class="btn btn-success btn-sm">Cadastrar</a>
        {% endif %}

    {% endif %}

</div>

    </div>
</nav>

<!-- Regiao de anuncios para leitores de tela. Fica invisivel na tela, mas
     tudo que o JavaScript escreve aqui e lido em voz alta, avisando quem nao
     ve que algo mudou na pagina sem ela ter recarregado. -->
<div id="anuncios" aria-live="polite" role="status" class="visually-hidden"></div>

<main class="container">
    {% block content %}
    {% endblock %}
</main>

<script src="{% static 'posts/js/smartbairro.js' %}"></script>

</body>
</html>
