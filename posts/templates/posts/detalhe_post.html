<!DOCTYPE html>
<html>
    {% if user == post.usuario %}
    <a href="/editar/{{ post.id }}/" class="btn btn-warning">Editar</a>
    <a href="/deletar/{{ post.id }}/" class="btn btn-danger">Deletar</a>
{% endif %}
{% if post.imagem %}
    <img src="{{ post.imagem.url }}" class="img-fluid mb-3">
{% endif %}
<head>
    <title>{{ post.titulo }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h1>{{ post.titulo }}</h1>
    <h5 class="text-muted">{{ post.categoria }}</h5>

    <hr>

    <p>{{ post.descricao }}</p>

    <a href="/" class="btn btn-secondary">Voltar</a>

</div>

</body>
</html>
