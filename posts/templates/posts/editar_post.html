<!DOCTYPE html>
<html>
<head>
    <title>Editar Post</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h1>Editar Post</h1>

    <form method="POST">
        {% csrf_token %}
        
        <div class="mb-3">
            <input type="text" name="titulo" class="form-control" value="{{ post.titulo }}">
        </div>
        
        <div class="mb-3">
            <textarea name="descricao" class="form-control">{{ post.descricao }}</textarea>
        </div>

        <div class="mb-3">
            <select name="categoria" class="form-control">

    <option value="servico" {% if post.categoria == 'servico' %}selected{% endif %}>Serviço</option>

    <option value="venda" {% if post.categoria == 'venda' %}selected{% endif %}>Venda</option>

    <option value="doacao" {% if post.categoria == 'doacao' %}selected{% endif %}>Doação</option>

    <option value="aviso" {% if post.categoria == 'aviso' %}selected{% endif %}>Aviso</option>

</select>
        </div>

        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="/" class="btn btn-secondary">Cancelar</a>
    </form>

</div>

</body>
</html>
